<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join the Bogus Boys | 2027</title><link rel="stylesheet" href="css/home-2027.css"><style>body{background:#101010;color:white}.wrap{max-width:550px;margin:55px auto;padding:24px}.panel{border:1px solid #b18a2c;background:#191919;border-radius:16px;padding:28px}h1{color:#ffb612}label{display:block;margin:12px 0}input{width:100%;padding:12px;margin-top:5px;box-sizing:border-box}button{background:#ffb612;border:0;padding:13px 18px;border-radius:8px;font-weight:bold;cursor:pointer}a{color:#ffb612}#registration-status{margin-top:20px;line-height:1.6}</style></head><body><main class="wrap"><div class="panel"><h1>Join the Bogus Boys</h1><p>Create an account, confirm your email, and wait for Commissioner approval.</p><form id="registration-form"><label>First name<input id="reg-first" autocomplete="given-name" required maxlength="60"></label><label>Last name<input id="reg-last" autocomplete="family-name" required maxlength="60"></label><label>Email<input id="reg-email" type="email" autocomplete="email" required></label><label>Password<input id="reg-password" type="password" autocomplete="new-password" minlength="8" required></label><button type="submit">Create Account</button></form><button id="registration-submit" hidden type="button">Request Commissioner Approval</button><p id="registration-status" role="status">Loading…</p><p><a href="login.html">Already registered? Sign in</a> · <a href="index.html">League Home</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="js/supabase-config.js"></script><script src="js/phase9-registration.js"></script></body></html>
